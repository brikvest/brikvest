<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Shipped with the application; relative to this config, never the CWD. -->
  <dir prefix="relative">liberation</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Exact original fonts may still use licensed host installations. The
       authorized fallback remains available even when this file is absent. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>